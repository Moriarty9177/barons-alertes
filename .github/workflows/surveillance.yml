name: Alertes Pokemon

on:
  # Une modification du lecteur ou du workflow vérifie immédiatement la version publiée.
  push:
    branches: [main]
    paths:
      - cloud_runner.py
      - .github/workflows/surveillance.yml
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Action
        type: choice
        required: true
        default: surveiller
        options:
          - surveiller
          - tester_notification
          - reprendre

permissions:
  contents: write

concurrency:
  group: barons-surveillance
  cancel-in-progress: false

jobs:
  surveillance:
    # Les depots prives consomment un quota de minutes ; ce programme vise le gratuit.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Charger le programme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Lire le catalogue et envoyer les alertes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'surveiller' }}
          PYTHONUNBUFFERED: '1'
        run: python cloud_runner.py --mode "$MODE"
